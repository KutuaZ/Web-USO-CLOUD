<div class="container">
    <section class="hero">
        <h1>{{ titulo }}</h1>
        <p>{{ subtitulo }}</p>
    </section>

    <!-- Formulario de registro (solo visual, sin validaciones ni JS) -->
    <section class="register-form">
        <form id="register-form" (submit)="$event.preventDefault()">
            <div class="mb-3">
                <label for="username" class="form-label">Nombre de Usuario</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="ej: miguel.devCloud" autocomplete="username" [(ngModel)]="username">
            </div>

            <div class="mb-3">
                <label for="name" class="form-label">Nombre Completo</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="ej: Miguel Angel Sepulveda Alvarez" [(ngModel)]="nombreCompleto">
            </div>

            <div class="mb-3">
                <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
                <div class="date-input-wrapper">
                    <i class="bi bi-calendar-week date-input-icon" aria-hidden="true"></i>
                    <input type="text" class="form-control date-input" id="fecha_nacimiento" name="fecha_nacimiento" autocomplete="bday" placeholder="Selecciona tu fecha" [(ngModel)]="fechaNacimiento">
                </div>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Número de teléfono</label>
                <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="ej: +56 9 1234 5678" inputmode="tel" [(ngModel)]="telefono">
            </div>

            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección (Opcional)</label>
                <input type="text" class="form-control" id="direccion" name="direccion" placeholder="ej: Calle Falsa 123, Ciudad, País" [(ngModel)]="direccion">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="ej: miguel&#64;example.com" [(ngModel)]="email">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" [(ngModel)]="password">
                <div class="password-strength" *ngIf="mostrarFuerzaPassword" aria-live="polite">
                    <div class="password-strength-label">Seguridad: <span></span></div>
                    <div class="strength">
                        <div class="strength-segment"></div>
                        <div class="strength-segment"></div>
                        <div class="strength-segment"></div>
                        <div class="strength-segment"></div>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="confirm-password" class="form-label">Confirmar Contraseña</label>
                <input type="password" class="form-control" id="confirm-password" name="confirm_password" [(ngModel)]="confirmPassword">
            </div>

            <div class="botones">
                <button type="submit" class="btn btn-primary">Registrar Cuenta</button>
                <button type="reset" class="btn btn-secondary">Limpiar Formulario</button>
            </div>

            <div class="mt-3">
                <a routerLink="/login">¿Ya tienes una cuenta? Inicia sesión aquí.</a>
            </div>
        </form>
    </section>
</div>
