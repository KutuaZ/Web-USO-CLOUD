<div class="container">
    <section class="hero">
        <h1>{{ titulo }}</h1>
        <p>{{ subtitulo }}</p>
    </section>

    <section class="row g-4 grid-products">
        <div class="col-12 col-md-6 col-lg-4" *ngFor="let prod of productos">
            <app-product-card
                [product]="prod"
                [category]="categoria"
                buttonText="Desplegar Base de Datos">
            </app-product-card>
        </div>
    </section>
</div>
